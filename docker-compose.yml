services:
  structurizr:
    image: structurizr/structurizr
    container_name: structurizr
    ports:
      - "8080:8080"
    volumes:
      - ./Structurizr:/usr/local/structurizr
    command: local /usr/local/structurizr/workspace/${WORKSPACE_NAME:-paynau}
    environment:
      WORKSPACE_NAME: ${WORKSPACE_NAME:-paynau}
